name: build

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure Inno Setup
        shell: powershell
        run: |
          if (-not (Test-Path 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe') -and -not (Test-Path "$env:LOCALAPPDATA\Programs\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --yes --no-progress
          }

      - name: Build
        shell: cmd
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\build.ps1

      - name: Test
        shell: powershell
        run: .\test.ps1

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: cursor-comet
          path: |
            dist/cursor-comet.exe
            dist/CursorComet-Setup.exe
            dist/SHA256SUMS.txt

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: Cursor Comet ${{ github.ref_name }}
          files: |
            dist/cursor-comet.exe
            dist/CursorComet-Setup.exe
            dist/SHA256SUMS.txt
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
